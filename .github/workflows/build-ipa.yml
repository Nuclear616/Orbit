name: Build Orbit IPA

on:
  workflow_dispatch:
    inputs:
      use_apple_placeholder_icon:
        description: 'Use a temporary Apple-logo placeholder and bypass broken icon assets'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15-intel

    steps:
      - name: Check out Orbit
        uses: actions/checkout@v4

      - name: Use Apple placeholder icon (optional)
        if: ${{ inputs.use_apple_placeholder_icon }}
        shell: bash
        run: |
          set -euo pipefail
          swift - <<'SWIFT'
          import AppKit
          import Foundation

          let size = 1024
          let image = NSImage(size: NSSize(width: size, height: size))
          image.lockFocus()
          NSColor(calibratedRed: 0.12, green: 0.28, blue: 0.55, alpha: 1).setFill()
          NSBezierPath(roundedRect: NSRect(x: 0, y: 0, width: size, height: size), xRadius: 190, yRadius: 190).fill()
          if let symbol = NSImage(systemSymbolName: "apple.logo", accessibilityDescription: "Apple placeholder") {
            let config = NSImage.SymbolConfiguration(pointSize: 560, weight: .regular)
            let mark = symbol.withSymbolConfiguration(config)!
            mark.isTemplate = true
            NSColor.white.set()
            let rect = NSRect(x: 232, y: 232, width: 560, height: 560)
            mark.draw(in: rect, from: .zero, operation: .sourceOver, fraction: 1)
          }
          image.unlockFocus()
          guard let tiff = image.tiffRepresentation,
                let bitmap = NSBitmapImageRep(data: tiff),
                let png = bitmap.representation(using: .png, properties: [:]) else {
            fatalError("Could not render Apple placeholder icon")
          }
          try png.write(to: URL(fileURLWithPath: "Assets.xcassets/AppIcon.appiconset/OrbitIcon-1024.png"))
          try png.write(to: URL(fileURLWithPath: "Assets.xcassets/OrbitIcon.imageset/OrbitIcon.png"))
          SWIFT

      - name: Show toolchain
        run: xcodebuild -version

      - name: Archive Orbit without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Orbit.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/exported"
          mkdir -p "$RUNNER_TEMP/exported/Payload"
          cp -R "$RUNNER_TEMP/Orbit.xcarchive/Products/Applications/Orbit.app" "$RUNNER_TEMP/exported/Payload/Orbit.app"
          (cd "$RUNNER_TEMP/exported" && zip -qry Orbit-unsigned.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/exported/Orbit-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$RUNNER_TEMP/exported/Orbit-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Orbit $tag" \
            --generate-notes

