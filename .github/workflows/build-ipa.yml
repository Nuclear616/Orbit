name: Build Orbit IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15-intel

    steps:
      - name: Check out Orbit
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Archive Orbit without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Orbit.xcodeproj \
            -scheme Orbit \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Orbit.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/exported"
          mkdir -p "$RUNNER_TEMP/exported/Payload"
          cp -R "$RUNNER_TEMP/Orbit.xcarchive/Products/Applications/Orbit.app" "$RUNNER_TEMP/exported/Payload/Orbit.app"
          (cd "$RUNNER_TEMP/exported" && zip -qry Orbit-unsigned.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/exported/Orbit-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$RUNNER_TEMP/exported/Orbit-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Orbit $tag" \
            --generate-notes

